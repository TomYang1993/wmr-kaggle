[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wmr"
version = "0.5.8"
description = "Detect, track and remove text overlays (watermarks) from your own videos"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pillow>=10.1",
    "av>=11",
    "rapidocr>=3.10",
]

[project.scripts]
wmr = "wmr.cli:main"

[tool.setuptools]
packages = ["wmr"]
